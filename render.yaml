services:
  - type: web
    name: p2p-file-share
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class gthread --threads 20 -b 0.0.0.0:$PORT app:app
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: STUN_SERVER
        value: stun:stun.l.google.com:19302
      - key: TURN_SERVER
        value: turn:openrelay.metered.ca:80
      - key: TURN_USERNAME
        value: openrelayproject
      - key: TURN_PASSWORD
        value: openrelayproject
      - key: ROOM_TIMEOUT_MINUTES
        value: 30
      - key: MAX_PEERS_PER_ROOM
        value: 2