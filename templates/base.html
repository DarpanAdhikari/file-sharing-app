<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>{% block title %}P2P File Share{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" href="data:,">
</head>
<body>
    <header class="navbar">
        <a class="navbar__brand" href="/">⇄ P2P File Share</a>
        <nav class="navbar__links">
            <a href="/">Rooms</a>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>Files transfer directly between devices via WebRTC. The server handles room discovery and signaling only.</p>
    </footer>

    <div id="toast-root" class="toast-root" aria-live="polite"></div>

    <script>
        window.P2P_CONFIG = {
            io: "{{ url_for('static', filename='js/vendor/socket.io.min.js') }}"
        };
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
